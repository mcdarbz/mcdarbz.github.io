<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCDARbz — Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(135deg, #0a2342 0%, #13457c 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .logo { max-width: 280px; margin-bottom: 30px; }
    h1 { font-size: 3rem; margin-bottom: 10px; }
    h1 span { color: #4ecdc4; }
    .tagline { font-size: 1.2rem; color: #b8c7d9; margin-bottom: 50px; max-width: 500px; }
    .btn {
      display: block; width: 280px; margin: 12px auto; padding: 18px;
      border-radius: 12px; font-size: 1.1rem; font-weight: 600;
      text-decoration: none; transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
    .btn-explore { background: #4ecdc4; color: #0a2342; }
    .btn-book { background: #0099ff; color: white; }
    .btn-whatsapp { background: #25d366; color: white; }
    .footer { margin-top: 50px; color: #6b9dc2; font-size: 0.9rem; }
  </style>
</head>
<body>
  <img src="logo.png" alt="MCDARbz" class="logo">

  <h1>Welcome to <span>MCDARbz</span></h1>
  <p class="tagline">A premium digital home — connect, discover, and stay updated.</p>

  <a href="explore.html" class="btn btn-explore">🚀 Explore Website</a>
  <a href="book.html" class="btn btn-book">📖 Read My Book</a>
  <a href="https://wa.me/639527383769" class="btn btn-whatsapp">💬 Contact on WhatsApp</a>

  <p class="footer">© 2026 MCDARbz — All Rights Reserved</p>
</body>
</html>
