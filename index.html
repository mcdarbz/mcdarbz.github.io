<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCDARBZ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body {
      background: #050a1a;
      color: #fff;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem; text-align: center;
    }
    .logo {
      width: 280px; height: 280px;
      background: url('logo.png') center/contain no-repeat;
      margin-bottom: 2rem;
    }
    h1 { font-size: clamp(2.2rem, 6vw, 3.5rem); color: #5ac8ff; margin-bottom: 0.5rem; }
    .tagline {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      color: #bfe8ff;
      max-width: 380px;
      margin-bottom: 3rem;
      line-height: 1.5;
    }
    .links { display: flex; flex-direction: column; gap: 1.2rem; width: 100%; max-width: 340px; }
    .btn {
      display: block; padding: 1.2rem 2rem; border-radius: 14px;
      text-decoration: none; font-weight: 600; font-size: 1.15rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.primary {
      background: linear-gradient(135deg, #0a66e8, #0090ff);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="logo"></div>

  <h1>Welcome to MCDARBZ</h1>
  <p class="tagline">A premium digital home for Mcdarbz — connect, discover, and stay updated.</p>

  <div class="links">
    <a href="book.html" class="btn primary">📖 Read The Comprehension Root Primer</a>
  </div>

</body>
</html>
