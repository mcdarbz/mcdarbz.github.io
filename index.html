<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCDARbz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #001a33, #003366);
            color: white;
            text-align: center;
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .logo {
            max-width: 400px;
            margin: 0 auto 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2.5rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }
        .btn {
            display: inline-block;
            width: 260px;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            transition: transform 0.2s ease;
        }
        .btn:hover {
            transform: scale(1.03);
        }
        .btn-explore {
            background: #ffffff;
            color: #003366;
        }
        .btn-whatsapp {
            background: #25d366;
            color: white;
        }
        .btn-book {
            background: #00b4ff;
            color: white;
        }
        .btn-meta {
            background: #3b82f6;
            color: white;
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="MCDARbz Logo" class="logo">

    <h1>Welcome to MCDARbz.</h1>
    <p>A premium digital home for Mcdarbz — connect, discover, and stay updated.</p>

    <div class="btn-container">
        <a href="book.html" target="_blank" class="btn btn-explore">Explore Website</a>
        <a href="https://wa.me/yourwhatsapplink" target="_blank" class="btn btn-whatsapp">WhatsApp</a>
        <a href="book.html" target="_blank" class="btn btn-book">📖 Read My Book</a>
        <a href="#" target="_blank" class="btn btn-meta">🤖 Meta AI</a>
    </div>

</body>
</html>
